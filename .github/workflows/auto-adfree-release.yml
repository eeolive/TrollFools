name: Auto Ad-Free Build

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  actions: read

env:
  THEOS: ""

jobs:
  sync-patch-build-release:
    runs-on: macos-14
    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync latest upstream tag and apply ad-free patch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/Lessica/TrollFools.git
          git fetch upstream --tags --force

          UPSTREAM_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          test -n "$UPSTREAM_TAG"
          UPSTREAM_SHA=$(git rev-list -n 1 "$UPSTREAM_TAG")
          VERSION=${UPSTREAM_TAG#v}
          RELEASE_TAG="adfree-${UPSTREAM_TAG}"

          cp .github/workflows/auto-adfree-release.yml "$RUNNER_TEMP/auto-adfree-release.yml"
          git read-tree --reset -u "$UPSTREAM_TAG"
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/auto-adfree-release.yml" .github/workflows/auto-adfree-release.yml

          python3 - <<'PY'
          from pathlib import Path
          p = Path('TrollFools/AppListView.swift')
          s = p.read_text()
          marker = '    var shouldShowAdvertisement: Bool {'
          start = s.find(marker)
          if start == -1:
              raise SystemExit('shouldShowAdvertisement block not found')
          end_marker = '\n    var appString:'
          end = s.find(end_marker, start)
          if end == -1:
              raise SystemExit('appString marker after ad block not found')
          replacement = '    var shouldShowAdvertisement: Bool {\n        false\n    }\n'
          p.write_text(s[:start] + replacement + s[end + 1:])
          PY

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "UPSTREAM_TAG=$UPSTREAM_TAG" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync ${UPSTREAM_TAG} and disable ads"
            git push origin HEAD:main
          else
            LAST_COMMIT_EPOCH=$(git log -1 --format=%ct)
            NOW_EPOCH=$(date +%s)
            AGE_DAYS=$(( (NOW_EPOCH - LAST_COMMIT_EPOCH) / 86400 ))
            if (( AGE_DAYS >= 45 )); then
              git commit --allow-empty -m "chore: keep scheduled workflow active"
              git push origin HEAD:main
            fi
          fi

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
            echo "Release $RELEASE_TAG already exists; skipping duplicate build."
          else
            echo "SKIP_BUILD=false" >> "$GITHUB_ENV"
          fi

      - name: Install Dependencies
        if: env.SKIP_BUILD != 'true'
        run: |
          echo /usr/local/opt/make/libexec/gnubin >> $GITHUB_PATH
          echo /opt/homebrew/opt/make/libexec/gnubin >> $GITHUB_PATH
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew install dpkg ldid-procursus make xcbeautify openssl@3

      - name: Checkout THEOS
        if: env.SKIP_BUILD != 'true'
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: 942cd0c015f93d8c2d714ba0c69e7f420157c382
          path: theos
          submodules: recursive

      - name: Add THEOS environment variables
        if: env.SKIP_BUILD != 'true'
        run: |
          rm -rf $GITHUB_WORKSPACE/theos/sdks
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV
          echo "THEOS_PACKAGE_SCHEME=rootless" >> $GITHUB_ENV
          echo "FINALPACKAGE=1" >> $GITHUB_ENV

      - name: Checkout SDKs
        if: env.SKIP_BUILD != 'true'
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          ref: master
          path: ${{ env.THEOS }}/sdks

      - name: Build Packages
        if: env.SKIP_BUILD != 'true'
        run: |
          make package
          mkdir -p dist
          cp packages/*.tipa dist/
          find .theos/obj -name "*.dSYM" -exec cp -r {} dist/ \;

      - name: Upload Artifact
        if: env.SKIP_BUILD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TrollFools-${{ env.VERSION }}-adfree
          path: |
            dist/*.tipa
            dist/*.dSYM

      - name: Publish GitHub Release
        if: env.SKIP_BUILD != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES="Ad-free build of the official upstream ${UPSTREAM_TAG} tag.\n\nUpstream: Lessica/TrollFools@${UPSTREAM_SHA}\nOnly app change: disables shouldShowAdvertisement in TrollFools/AppListView.swift."
          gh release create "$RELEASE_TAG" dist/*.tipa --repo "${{ github.repository }}" --target main --title "TrollFools ${VERSION} Ad-Free" --notes "$NOTES"
